<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Pack Data Boards</title>
<style>
:root{--bg:#f6f4f0;--ink:#22232b;--mute:#7a7468;--line:#d9d2c5;--accent:#22232b;--gold:#b08d57;--gold-d:#8a6a36}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 24px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);font-size:13px;margin:2px 0 0}
.bar{display:flex;gap:8px}
button,.btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid #c5ccd8;background:#fff;cursor:pointer;color:var(--ink)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;letter-spacing:.04em}
#drop{margin:16px 24px;border:2px dashed #b3bccb;border-radius:10px;padding:22px;text-align:center;color:var(--mute);background:#fff}
#drop.over{border-color:var(--accent);background:#eef3ff}
#status{margin:0 24px;font-size:13px;color:var(--mute);min-height:18px}
#boards{padding:20px 24px 40px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-bottom:20px}
.ptitle,.pdate{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;width:100%;max-width:400px;justify-self:center;position:relative;box-shadow:0 1px 2px rgba(40,30,10,.06),0 6px 18px rgba(40,30,10,.07)}
.card.empty{border:1px dashed #cfc7b8;opacity:.6;box-shadow:none}
.card .img{height:300px;display:flex;align-items:center;justify-content:center;padding:10px;background:#fbf9f6;border-radius:5px 5px 0 0}
.card .img img{max-width:100%;max-height:100%;mix-blend-mode:multiply}
.card .img span{color:#aaa;font-size:13px}
.card .row{display:grid;grid-template-columns:46% 54%;border-top:1px solid var(--line);min-height:40px;background:#fff}
.card .img+.row{border-top:2px solid var(--gold)}
.card .lab{padding:6px 9px;font-size:14px;letter-spacing:.02em;color:var(--ink);border-right:1px solid var(--line);display:flex;align-items:center}
.card .val{text-transform:uppercase;padding:6px 9px;font-size:14px;letter-spacing:.02em;color:var(--ink);outline:none;display:flex;align-items:center;min-width:0;overflow-wrap:anywhere}
.card .val:focus{background:#eef3ff}
.x{position:absolute;top:4px;right:6px;border:0;background:none;color:#999;font-size:18px;padding:0 4px}
@page{size:A4 landscape;margin:0}
@media print{
  header,#drop,#status,.x,.card.empty{display:none}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #boards{padding:0}
  .sheet{grid-template-columns:repeat(3,1fr);gap:6mm;margin:0;position:relative;width:297mm;height:210mm;padding:21mm 12mm 11mm;break-after:page;overflow:hidden;align-content:start;background:#fff}
  .sheet.blank{display:none}
  .sheet.lastreal{break-after:auto}
  .ptitle{display:block;position:absolute;top:8mm;left:12mm;right:12mm;margin:0;padding-bottom:3mm;border-bottom:.5mm solid var(--gold);font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:17pt;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
  .ptitle b{font-weight:700;color:var(--gold-d)}
  .pdate{display:block;position:absolute;bottom:5mm;right:12mm;font-size:9pt;letter-spacing:.16em;color:var(--mute);border-top:.2mm solid var(--line);padding-top:1.5mm;min-width:30mm;text-align:right}
  .card{max-width:none;break-inside:avoid;box-shadow:none;border-radius:2mm}
  .card .img{height:30mm;padding:2mm}
  .card .row{min-height:5.6mm}
  .card .lab{font-size:8.5pt;padding:.5mm 1.5mm}
  .card .val{font-size:8.5pt;padding:.5mm 1.5mm}
}
</style>
</head>
<body>
<header>
  <div><h1>Tech Pack Data Boards</h1><p class="sub">Upload tech-pack PDFs — each one becomes a board. Everything is processed in your browser.</p></div>
  <div class="bar">
    <button id="clear">Clear all</button>
    <button id="print">Print</button>
    <button id="dlxls">Download Excel</button>
    <button id="dlpdf" class="primary">Download PDF</button>
  </div>
</header>
<div id="drop">
  <p style="margin:0 0 10px">Drop PDF files here (6 or more)</p>
  <label class="btn primary">Choose PDFs<input id="file" type="file" accept="application/pdf" multiple hidden></label>
</div>
<div id="status"></div>
<main id="boards"></main>
<script src="lib/pdf.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/exceljs.min.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
